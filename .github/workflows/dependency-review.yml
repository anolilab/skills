name: "Dependency review"

on: # yamllint disable-line rule:truthy
    pull_request:
        branches:
            - "main"

permissions: {}

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

jobs:
    dependency-review:
        permissions:
            contents: "read"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/dependency-review.yml@ad133c06463ecade56b67dd20a793ed89cb1ae33" # v26.0.10
